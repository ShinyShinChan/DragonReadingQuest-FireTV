name: Build Fire TV APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          # GitHub's Ubuntu runners already provide the Android SDK.
          # Do not invoke android-actions/setup-android@v3: it attempts
          # to install obsolete package 'tools' on some runner images.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DragonReadingQuest-FireTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DragonReadingQuest-FireTV-APK
          path: DragonReadingQuest-FireTV.apk
      - name: Publish convenient download link
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view firetv-latest >/dev/null 2>&1 || gh release create firetv-latest --target "$GITHUB_SHA" --title "Dragon Reading Quest - Fire TV" --notes "Family sideload build. For newer APKs, uninstall the previous debug-signed build if Android reports a signature conflict. Uninstalling can remove local reading progress."
          gh release upload firetv-latest DragonReadingQuest-FireTV.apk --clobber
